name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :androidApp:assembleRelease
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: cp androidApp/build/outputs/apk/release/androidApp-release.apk BYDStats-${{ github.ref_name }}.apk

      - name: Extract release notes from RELEASE_NOTES.md
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk "BEGIN{f=0} /^# v${VERSION}/{f=1; next} f && /^---$/{exit} f && /^# v[0-9]/{exit} f{print}" \
            RELEASE_NOTES.md > release_body.md
          # 내용이 없으면 태그 이름을 fallback으로
          if [ ! -s release_body.md ]; then
            echo "BYD Stats ${{ github.ref_name }}" > release_body.md
          fi

      - name: Create or Update GitHub Release
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              "BYDStats-${{ github.ref_name }}.apk" --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --title "BYD Stats ${{ github.ref_name }}" \
              --notes-file release_body.md \
              "BYDStats-${{ github.ref_name }}.apk"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
