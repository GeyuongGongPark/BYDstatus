name: BydStats
options:
  bundleIdPrefix: com.ggpark
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

schemes:
  BydStats:
    build:
      targets:
        BydStats: all
        BydStatsWidget: all

targets:
  BydStats:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BydStats
      - path: BydStatsWidget/BydLiveActivityAttributes.swift
    info:
      path: BydStats/Resources/Info.plist
      properties:
        CFBundleDisplayName: BYD Stats
        CFBundleVersion: "6"
        CFBundleShortVersionString: "0.4.0"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: "충전 세션 위치 기록 및 주행 거리 측정에 사용됩니다."
        NSLocationAlwaysAndWhenInUseUsageDescription: "백그라운드에서 충전/주행 위치를 기록합니다."
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.ggpark.BydStats.refresh
        NSSupportsLiveActivities: YES
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ggpark.BydStats
      SWIFT_VERSION: "6.0"
      DEVELOPMENT_TEAM: ""
      TARGETED_DEVICE_FAMILY: "1"
      ENABLE_PREVIEWS: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
      ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT: YES
    entitlements:
      path: BydStats/Resources/BydStats.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ggpark.BydStats
    dependencies:
      - framework: BackgroundTasks.framework
        embed: false
      - target: BydStatsWidget
        embed: true

  BydStatsWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BydStatsWidget
    info:
      path: BydStatsWidget/Info.plist
      properties:
        CFBundleDisplayName: BYD Stats Widget
        CFBundleVersion: "6"
        CFBundleShortVersionString: "0.4.0"
        NSSupportsLiveActivities: YES
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ggpark.BydStats.widget
      SWIFT_VERSION: "6.0"
      DEVELOPMENT_TEAM: ""
      SKIP_INSTALL: YES
    entitlements:
      path: BydStatsWidget/BydStatsWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ggpark.BydStats
